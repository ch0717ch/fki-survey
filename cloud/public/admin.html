<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="robots" content="noindex, nofollow" />
    <title>설문 관리자 · FKI 한경협국제경영원</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="admin">
    <!-- ================= 로그인 ================= -->
    <section class="screen is-active" id="screenGate">
      <div class="gate">
        <div class="gate__box">
          <div class="crest"><span></span><i></i><span></span></div>
          <h1>설문 관리자</h1>
          <p>FKI 한경협국제경영원 인재교육사업실</p>
          <input
            class="field"
            type="password"
            id="pw"
            placeholder="비밀번호"
            autocomplete="current-password"
          />
          <button class="btn btn--block" id="btnLogin">로그인</button>
        </div>
      </div>
    </section>

    <!-- ================= 관리 화면 ================= -->
    <section class="screen" id="screenAdmin">
      <header class="admin-top">
        <div class="admin-top__inner">
          <div class="admin-top__brand">
            설문 관리자
            <small>FKI 한경협국제경영원 인재교육사업실</small>
          </div>
          <a class="btn btn--ghost btn--sm" href="/" target="_blank" rel="noopener">응답 화면 열기</a>
          <button class="btn btn--ghost btn--sm" id="btnLogout">로그아웃</button>
        </div>
      </header>

      <div class="admin-wrap">
        <!-- 목록 -->
        <aside class="side">
          <div class="side__head">
            <h2>설문 목록</h2>
          </div>
          <div class="side__list" id="surveyList"></div>
          <div class="actions" style="margin-top: 14px">
            <button class="rnd rnd--add" data-new="A">＋ A형 새 설문</button>
            <button class="rnd rnd--add" data-new="B">＋ B형 새 설문</button>
            <button class="rnd rnd--add" data-new="blank">＋ 빈 설문</button>
          </div>
        </aside>

        <!-- 편집 -->
        <main id="editor">
          <div class="empty">왼쪽에서 설문을 선택하세요.</div>
        </main>
      </div>
    </section>

    <div class="toast" id="toast"></div>
    <script src="/js/vendor/exceljs.min.js"></script>
    <script src="/js/xlsx-export.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
